<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><title>Shipping address</title></head><body>
<h1>Shipping</h1>
<form onsubmit="return false">
  <label for="fn">First name</label><input id="fn" name="firstName">
  <label for="ln">Last name</label><input id="ln" name="lastName">
  <label for="a1">Street address</label><input id="a1" name="address1">
  <label for="a2">Apartment, suite</label><input id="a2" name="address2">
  <label for="ci">City</label><input id="ci" name="city">
  <label for="st">State</label><select id="st" name="state"><option value="">--</option><option value="CA">California</option><option value="NY">New York</option><option value="WA">Washington</option></select>
  <label for="zp">ZIP code</label><input id="zp" name="zip">
  <label for="co">Country</label><select id="co" name="country"><option value="">--</option><option value="DE">Germany</option><option value="US">United States</option></select>
  <label for="ph">Phone</label><input id="ph" name="phone" type="tel">
  <label for="em">Email</label><input id="em" name="email" type="email">
  <button>Continue</button>
</form>
</body></html>
