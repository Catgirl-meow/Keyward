<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><title>Plain login</title></head><body>
<h1>Plain login</h1>
<input type="search" name="q" placeholder="Search the site" id="search">
<form id="f" action="/done" method="post">
  <label for="u">Email</label><input id="u" name="email" type="email" autocomplete="username">
  <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password">
  <button type="submit">Sign in</button>
</form>
</body></html>
