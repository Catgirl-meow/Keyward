<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><title>Account security</title></head><body>
<!-- github.com/settings/security's "Change password" form (markup of the real page, saved
     2026-10-23): the new-password field says autocomplete=off and sits in <auto-check>, and
     there is a hidden honeypot text field. GitHub redirects back to this page after a change. -->
<change-password>
<div>
 <form data-turbo="false" class="edit_user" id="sign_in_methods_change_password" aria-label="Change password" action="/account/password" accept-charset="UTF-8" method="post"><input type="hidden" name="_method" value="put"><input type="hidden" name="authenticity_token" value="fixture-token">
 <div class="form-group password-confirmation-form">
 <div class="mb-1"><label for="user_old_password_sign_in_methods">Old password</label></div>
 <input type="password" name="user[old_password]" id="user_old_password_sign_in_methods" required autocomplete="current-password" class="form-control">
 </div>
 <password-strength minimum-character-count="8" passphrase-length="15">
 <div class="form-group password-confirmation-form">
 <div class="mb-1"><label for="user_new_password_sign_in_methods">New password</label></div>
 <auto-check src="/users/password">
 <input type="password" name="user[password]" id="user_new_password_sign_in_methods" required passwordrules="minlength: 15; allowed: unicode;" autocomplete="off" aria-describedby="password-req-note-sign-in-methods" class="form-control" spellcheck="false">
 <input type="hidden" name="authenticity_token" value="fixture-token-2"></auto-check> </div>
 <div class="form-group password-confirmation-form">
 <div class="mb-1"><label for="user_confirm_new_password_sign_in_methods">Confirm new password</label></div>
 <input type="password" name="user[password_confirmation]" id="user_confirm_new_password_sign_in_methods" required autocomplete="new-password" class="form-control">
 </div>
 <p id="password-req-note-sign-in-methods" class="note">Make sure it's at least 15 characters OR at least 8 characters including a number and a lowercase letter.</p>
 </password-strength>
 <input type="text" name="required_field_e14a" hidden class="form-control" value=""><input type="hidden" name="timestamp" value="1"><input type="hidden" name="timestamp_secret" value="x">
 <p>
 <button type="submit" class="Button--secondary Button--medium Button mr-2"><span class="Button-content"><span class="Button-label">Update password</span></span></button>
 <span><a href="/password_reset">I forgot my password</a></span>
 </p>
</form>
</div>
</change-password>
</body></html>
