<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><title>Confirm sign-in</title></head><body>
<!-- A bank's second step whose code box is an unlabeled-looking password field: nothing about it
     says "code", so only the value (6 digits) tells it apart from a password. -->
<h1>Confirm sign-in</h1>
<p>We sent you a message.</p>
<form action="/done" method="post">
  <label for="p">Password</label><input id="p" type="password" name="p">
  <button>Continue</button>
</form>
</body></html>
