<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="/style.css"><title>Split card frames</title><style>iframe{display:block;border:1px solid #ccc;width:300px;height:48px;margin:8px 0}</style></head><body>
<h1>Pay (card fields in frames)</h1>
<label>Name on card</label><input name="ccname" id="nm" autocomplete="cc-name">
<!-- Cross-site frames on this page's own port (KW_FIXTURE_PORT may move the fixtures off 8090). -->
<script>for (const [id, f] of [["f1", "number"], ["f2", "exp"], ["f3", "cvc"]]) document.write(`<iframe id="${id}" src="http://other.localhost:${location.port}/card-part.html?f=${f}"></iframe>`);</script>
</body></html>
