# Manual release from a GitHub runner: the same steps as `npm run release` on a laptop.
# Needs repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET (addons.mozilla.org API key),
# and the repository variable KW_GECKO_ID if the add-on was first signed with a custom id.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Raise the version first
        type: choice
        options: [none, patch, minor, major]
        default: patch
      draft:
        description: Publish the GitHub release as a draft
        type: boolean
        default: false

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Release
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          KW_GECKO_ID: ${{ vars.KW_GECKO_ID }}
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          DRAFT: ${{ inputs.draft }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          args=()
          [ "$BUMP" != none ] && args+=("--bump=$BUMP")
          [ "$DRAFT" = true ] && args+=(--draft)
          node scripts/release.ts "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dist
          path: |
            dist/*.zip
            dist/signed/*.xpi
            dist/SHA256SUMS
          if-no-files-found: ignore
